name: Release Windows
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: python tools/check_version.py '${{ github.ref_name }}'
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci
      - run: npm ci --prefix aika_hunt_app
      - run: npm test
      - run: npm run build
      - name: Conferir motor empacotado
        run: python tools/smoke_backend.py
      - name: Publicar instalador e metadados de atualizacao
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $flags = @('--title', 'HuntingAitan ${{ github.ref_name }}', '--notes-file', 'RELEASE_NOTES.md', '--verify-tag')
          if ('${{ github.ref_name }}' -match '-') { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' @flags release/*.exe release/*.yml release/*.blockmap
